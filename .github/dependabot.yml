version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      # One PR for routine dev-tool bumps instead of one per package.
      dev-dependencies:
        dependency-type: development
        update-types: [minor, patch]
    ignore:
      # Next majors need a deliberate upgrade (see APPROACH.md: npm audit note).
      - dependency-name: next
        update-types: [version-update:semver-major]
      - dependency-name: eslint-config-next
        update-types: [version-update:semver-major]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
